<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure Password Manager</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ── Lock Screen ─────────────────────────────────────────────── -->
  <section id="lock-screen" class="screen">
    <div class="brand">
      <span class="brand-icon">🔐</span>
      <h1>Password Manager</h1>
      <p class="subtitle">Zero-knowledge · AES-256-GCM</p>
    </div>

    <div class="form-group">
      <label for="master-password">Master Password</label>
      <div class="input-row">
        <input
          type="password"
          id="master-password"
          placeholder="Enter master password"
          autocomplete="current-password"
        />
        <button class="icon-btn" id="toggle-master-pw" title="Show / hide">👁</button>
      </div>
    </div>

    <p id="lock-error" class="error-msg hidden"></p>

    <button id="unlock-btn" class="btn btn-primary btn-block">Unlock Vault</button>

    <p class="hint">
      First time? Enter a master password to create your encrypted vault.
    </p>
  </section>

  <!-- ── Main Screen ─────────────────────────────────────────────── -->
  <section id="main-screen" class="screen hidden">

    <!-- Header -->
    <header class="app-header">
      <span class="brand-icon-sm">🔐</span>
      <span class="app-title">Password Manager</span>
      <button id="lock-btn" class="btn btn-sm btn-outline" title="Lock vault">🔒 Lock</button>
    </header>

    <!-- Tab bar -->
    <nav class="tab-bar">
      <button class="tab-btn active" data-tab="vault">Vault</button>
      <button class="tab-btn" data-tab="add">Add</button>
      <button class="tab-btn" data-tab="generator">Generator</button>
    </nav>

    <!-- ── Vault Tab ───────────────────────────────────────────────── -->
    <div id="tab-vault" class="tab-content active">
      <div class="search-row">
        <input type="text" id="search-input" placeholder="Search credentials…" />
      </div>
      <ul id="credential-list" class="credential-list">
        <li class="empty-state">No saved credentials yet.</li>
      </ul>
    </div>

    <!-- ── Add Tab ─────────────────────────────────────────────────── -->
    <div id="tab-add" class="tab-content hidden">
      <h2 class="section-title">Add Credential</h2>

      <div class="form-group">
        <label for="add-url">Website URL</label>
        <input type="url" id="add-url" placeholder="https://example.com" />
      </div>

      <div class="form-group">
        <label for="add-username">Username / Email</label>
        <input type="text" id="add-username" placeholder="you@example.com" autocomplete="off" />
      </div>

      <div class="form-group">
        <label for="add-password">Password</label>
        <div class="input-row">
          <input type="password" id="add-password" placeholder="Password" autocomplete="new-password" />
          <button class="icon-btn" id="toggle-add-pw" title="Show / hide">👁</button>
        </div>
        <div class="btn-row mt-xs">
          <button id="fill-generated-btn" class="btn btn-sm btn-outline">⚡ Use Generated</button>
          <button id="check-breach-btn"   class="btn btn-sm btn-outline">🛡 Check Breach</button>
        </div>
        <p id="breach-result" class="hidden breach-msg"></p>
      </div>

      <p id="add-error" class="error-msg hidden"></p>
      <p id="add-success" class="success-msg hidden">Credential saved!</p>

      <button id="save-btn" class="btn btn-primary btn-block">Save Credential</button>
    </div>

    <!-- ── Generator Tab ──────────────────────────────────────────── -->
    <div id="tab-generator" class="tab-content hidden">
      <h2 class="section-title">Password Generator</h2>

      <div class="form-group">
        <label for="pw-length">Length: <span id="length-display">16</span></label>
        <input type="range" id="pw-length" min="8" max="64" value="16" />
      </div>

      <div class="generated-output">
        <input type="text" id="generated-password" readonly placeholder="Click Generate" />
        <button class="icon-btn" id="copy-pw-btn" title="Copy">📋</button>
      </div>

      <button id="generate-btn" class="btn btn-primary btn-block">Generate Password</button>

      <p id="copy-msg" class="success-msg hidden">Copied to clipboard!</p>
    </div>

  </section>

  <!-- ── Credential Detail Modal ──────────────────────────────────── -->
  <div id="detail-modal" class="modal-overlay hidden">
    <div class="modal">
      <h3 class="modal-title">Credential Details</h3>
      <div class="detail-row"><span class="detail-label">URL</span>      <span id="detail-url"></span></div>
      <div class="detail-row"><span class="detail-label">Username</span> <span id="detail-username"></span></div>
      <div class="detail-row">
        <span class="detail-label">Password</span>
        <span id="detail-password" class="blurred">••••••••</span>
        <button class="icon-btn" id="toggle-detail-pw">👁</button>
      </div>
      <div class="modal-actions">
        <button id="copy-detail-pw-btn"  class="btn btn-sm btn-outline">📋 Copy</button>
        <button id="delete-credential-btn" class="btn btn-sm btn-danger">🗑 Delete</button>
        <button id="close-modal-btn"     class="btn btn-sm btn-outline">Close</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
